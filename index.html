<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- APP START -->
<title>Closet Shuffle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #F1F2F6;
    --surface: #FFFFFF;
    --sunken: #E6E8EF;
    --ink: #1A1D26;
    --muted: #5C6273;
    --line: #D6D9E2;
    --accent: #B8325F;
    --accent-soft: #F6DCE6;
    --on-accent: #FFFFFF;
    --good: #2D7A55;
    --shadow: 0 1px 2px rgba(26,29,38,.06), 0 6px 18px rgba(26,29,38,.07);
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121419; --surface: #1C1F27; --sunken: #262A34; --ink: #ECEEF3; --muted: #A2A8B7;
      --line: #313644; --accent: #E6739A; --accent-soft: #3D1F2B; --on-accent: #1B0A11; --good: #6CC79A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121419; --surface: #1C1F27; --sunken: #262A34; --ink: #ECEEF3; --muted: #A2A8B7;
    --line: #313644; --accent: #E6739A; --accent-soft: #3D1F2B; --on-accent: #1B0A11; --good: #6CC79A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
    padding-inline: 16px; padding-block: 0 64px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.1; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

  /* Header + tabs */
  header.top {
    display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px;
    padding-block: 28px 16px;
  }
  .brand h1 { font-size: clamp(30px, 6vw, 44px); font-weight: 800; letter-spacing: -.02em; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 4px 0 0; color: var(--muted); }
  nav.tabs {
    display: flex; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 999px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-bottom: 20px; width: fit-content; max-width: 100%;
  }
  nav.tabs button {
    border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; font-weight: 700; color: var(--muted);
    white-space: nowrap;
  }
  nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  nav.tabs .count { font-family: var(--mono); font-size: 12px; margin-left: 4px; opacity: .7; }

  /* Banner for example data */
  .banner {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
    background: var(--accent-soft); border-radius: 12px; padding: 12px 16px; margin-bottom: 20px;
  }
  .banner p { margin: 0; }

  /* Filters */
  .filters { display: grid; gap: 14px; margin-bottom: 20px; }
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .filter-row > .mono { width: 88px; color: var(--muted); }
  @media (max-width: 520px) { .filter-row > .mono { width: 100%; } }
  .chip {
    border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700;
  }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  .btn {
    border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; background: var(--sunken);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); font-size: 18px; padding: 14px 26px; font-family: var(--display); }
  .btn.primary:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.small { padding: 7px 12px; border-radius: 9px; font-size: 14px; }
  .btn.danger { color: var(--accent); }

  /* Outfit hang tags */
  .outfit { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .tag {
    position: relative; background: var(--surface); border-radius: 14px 14px 12px 12px; box-shadow: var(--shadow);
    padding: 26px 14px 14px; display: grid; gap: 8px; align-content: start;
  }
  .tag::before { /* punched hole */
    content: ""; position: absolute; top: 9px; left: 50%; width: 10px; height: 10px; margin-left: -5px;
    border-radius: 50%; background: var(--bg); box-shadow: inset 0 1px 2px rgba(0,0,0,.2);
  }
  .tag .slot { color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .tag.locked { outline: 2px solid var(--accent); }
  .thumb {
    aspect-ratio: 1; max-width: 100%; border-radius: 10px; background: var(--sunken); display: grid; place-items: center; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb svg { width: 72%; height: 72%; }
  .tag h3 { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .tag .meta { color: var(--muted); font-size: 11px; }
  .tag .row { display: flex; gap: 6px; }
  .tag .row .btn { flex: 1; justify-content: center; }
  .lock[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .note { color: var(--muted); margin: 16px 0 0; }
  .note strong { color: var(--ink); }
  .empty-state { background: var(--surface); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); }
  .empty-state h3 { font-size: 22px; margin-bottom: 6px; }
  .empty-state p { margin: 0 0 14px; color: var(--muted); max-width: 60ch; }

  /* Closet */
  .closet-layout { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 820px) { .closet-layout { grid-template-columns: 340px minmax(0, 1fr); align-items: start; } }
  form.add {
    background: var(--surface); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 16px;
  }
  @media (min-width: 820px) { form.add { position: sticky; top: 76px; } }
  form.add h2 { font-size: 24px; }
  .field { display: grid; gap: 6px; }
  .field > label, .field > .mono { color: var(--muted); }
  .field input[type="text"], .field select {
    width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px;
  }
  .photo-pick { display: flex; gap: 12px; align-items: center; }
  .photo-pick .thumb { width: 72px; flex: none; }
  .photo-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); padding: 0; position: relative;
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); border-color: transparent; }
  .color-name { font-size: 14px; color: var(--muted); }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks label {
    display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px;
    cursor: pointer; font-weight: 700; font-size: 14px;
  }
  .checks input { accent-color: var(--accent); margin: 0; }
  .form-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .cat-group { margin-bottom: 26px; }
  .cat-group h2 { font-size: 20px; display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .cat-group h2 .mono { color: var(--muted); }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .item { background: var(--surface); border-radius: 12px; padding: 10px; box-shadow: var(--shadow); display: grid; gap: 6px; align-content: start; }
  .item h3 { font-size: 15px; font-weight: 600; font-family: var(--body); overflow-wrap: anywhere; }
  .item .meta { color: var(--muted); font-size: 10.5px; }
  .item .row { display: flex; gap: 6px; }
  .item .row .btn { flex: 1; justify-content: center; padding-inline: 6px; }

  /* Saved */
  .saved-list { display: grid; gap: 12px; }
  .saved {
    background: var(--surface); border-radius: 14px; padding: 14px; box-shadow: var(--shadow);
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  }
  .saved .minis { display: flex; flex-wrap: wrap; gap: 6px; }
  .saved .minis .thumb { width: 56px; }
  .saved .when { color: var(--muted); font-size: 13px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 700;
    max-width: calc(100% - 32px); z-index: 20;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: no-preference) {
    .tag { animation: drop .35s ease-out both; }
    .tag:nth-child(2) { animation-delay: .04s; } .tag:nth-child(3) { animation-delay: .08s; }
    .tag:nth-child(4) { animation-delay: .12s; } .tag:nth-child(5) { animation-delay: .16s; }
    @keyframes drop { from { transform: translateY(-6px) rotate(-1deg); } to { transform: none; } }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="cs-pattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e8d9b8"/><rect width="4" height="8" fill="#c7323a"/>
    </pattern>
  </defs>
</svg>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Closet <span>Shuffle</span></h1>
      <p>Outfits made only from clothes you own.</p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-dress" aria-selected="true" data-tab="dress">Get dressed</button>
    <button role="tab" id="tab-closet" aria-selected="false" data-tab="closet">My closet<span class="count" id="count-items"></span></button>
    <button role="tab" id="tab-saved" aria-selected="false" data-tab="saved">Saved<span class="count" id="count-saved"></span></button>
  </nav>

  <div class="banner" id="sample-banner" hidden>
    <p><strong>You're looking at an example closet.</strong> Add your first piece and these examples go away.</p>
    <button class="btn small" data-action="go-add">Add my clothes</button>
  </div>

  <!-- GET DRESSED -->
  <section id="panel-dress" role="tabpanel" aria-labelledby="tab-dress">
    <div class="filters">
      <div class="filter-row" role="group" aria-label="Weather">
        <span class="mono">Weather</span>
        <button class="chip" data-filter="weather" data-value="any">Any</button>
        <button class="chip" data-filter="weather" data-value="hot">Hot</button>
        <button class="chip" data-filter="weather" data-value="mild">Mild</button>
        <button class="chip" data-filter="weather" data-value="cold">Cold</button>
      </div>
      <div class="filter-row" role="group" aria-label="Occasion">
        <span class="mono">Occasion</span>
        <button class="chip" data-filter="occasion" data-value="any">Any</button>
        <button class="chip" data-filter="occasion" data-value="casual">Casual</button>
        <button class="chip" data-filter="occasion" data-value="work">Work</button>
        <button class="chip" data-filter="occasion" data-value="dressy">Dressy</button>
        <button class="chip" data-filter="occasion" data-value="active">Active</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="shuffle-btn" data-action="shuffle">Shuffle outfit</button>
      <button class="btn" id="save-btn" data-action="save-outfit">Save this outfit</button>
    </div>
    <div class="outfit" id="outfit" aria-live="polite"></div>
    <p class="note" id="outfit-note"></p>
  </section>

  <!-- CLOSET -->
  <section id="panel-closet" role="tabpanel" aria-labelledby="tab-closet" hidden>
    <div class="closet-layout">
      <form class="add" id="item-form" novalidate>
        <h2 id="form-title">Add a piece</h2>

        <div class="field">
          <span class="mono">Photo (optional)</span>
          <div class="photo-pick">
            <div class="thumb" id="photo-preview"></div>
            <div style="display:grid;gap:6px">
              <label class="btn small" for="f-photo">Choose photo</label>
              <input type="file" id="f-photo" accept="image/*">
              <button type="button" class="btn small danger" id="photo-clear" hidden>Remove photo</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="f-type">What is it?</label>
          <select id="f-type"></select>
        </div>

        <div class="field">
          <label for="f-name">Name (optional)</label>
          <input type="text" id="f-name" maxlength="60" placeholder="e.g. Striped linen shirt" autocomplete="off">
        </div>

        <div class="field">
          <span class="mono">Main color</span>
          <div class="swatches" id="f-colors" role="group" aria-label="Main color"></div>
          <span class="color-name" id="color-name"></span>
        </div>

        <div class="field">
          <span class="mono">Good for this weather</span>
          <div class="checks" id="f-weather"></div>
        </div>

        <div class="field">
          <span class="mono">Good for</span>
          <div class="checks" id="f-occasion"></div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn primary" id="form-submit">Add to closet</button>
          <button type="button" class="btn" id="form-cancel" hidden>Cancel</button>
        </div>
      </form>

      <div id="closet-list"></div>
    </div>
  </section>

  <!-- SAVED -->
  <section id="panel-saved" role="tabpanel" aria-labelledby="tab-saved" hidden>
    <div class="saved-list" id="saved-list"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";

  // ---------- Reference data ----------
  const CATS = [
    { id: "top", label: "Top", plural: "Tops" },
    { id: "bottom", label: "Bottoms", plural: "Bottoms" },
    { id: "dress", label: "Dress / jumpsuit", plural: "Dresses & jumpsuits" },
    { id: "outer", label: "Jacket / coat", plural: "Jackets & coats" },
    { id: "shoes", label: "Shoes", plural: "Shoes" },
    { id: "accessory", label: "Accessory", plural: "Accessories" }
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
  const SLOT_ORDER = ["outer", "top", "dress", "bottom", "shoes", "accessory"];
  const COLORS = {
    black: "#1D1D1F", white: "#F7F7F4", gray: "#9A9CA3", navy: "#23315A", beige: "#D9C7A7",
    brown: "#7A5234", denim: "#5B7FA6", olive: "#6F7443", red: "#C7323A", pink: "#E79BB5",
    orange: "#E27A32", yellow: "#ECC94B", green: "#3F8F5A", blue: "#3A6FD8", purple: "#7A4FB0",
    pattern: "url(#cs-pattern)"
  };
  // Neutrals go with anything; everything else counts as a "statement" color.
  const NEUTRAL = new Set(["black", "white", "gray", "navy", "beige", "brown", "denim", "olive"]);
  const WEATHER = [["hot", "Hot"], ["mild", "Mild"], ["cold", "Cold"]];
  const OCCASIONS = [["casual", "Casual"], ["work", "Work"], ["dressy", "Dressy"], ["active", "Active"]];
  const ICONS = {
    top: "M16 6 L8 10 L3 20 L10 23 L12 19 L12 42 L36 42 L36 19 L38 23 L45 20 L40 10 L32 6 Q24 12 16 6Z",
    bottom: "M13 5 H35 L38 43 H28 L24 18 L20 43 H10 Z",
    dress: "M18 4 H30 L29 14 L39 43 H9 L19 14 Z",
    outer: "M17 5 L8 9 L5 40 L11 41 L13 22 L13 43 L23 43 L24 14 L25 43 L35 43 L35 22 L37 41 L43 40 L40 9 L31 5 L24 14 Z",
    shoes: "M5 30 Q5 22 10 20 L17 19 Q20 26 28 27 L40 30 Q44 31 44 35 L44 38 L5 38 Z",
    accessory: "M10 18 H38 L36 42 H12 Z"
  };

  // Shown only until the user adds their own first piece.
  const SAMPLE = [
    ["s1", "White tee", "top", "white", ["hot", "mild"], ["casual", "active"]],
    ["s2", "Navy button-down", "top", "navy", ["mild", "cold"], ["work", "casual"]],
    ["s3", "Striped knit", "top", "pattern", ["mild", "cold"], ["casual"]],
    ["s4", "Red silk blouse", "top", "red", ["hot", "mild"], ["work", "dressy"]],
    ["s5", "Straight-leg jeans", "bottom", "denim", ["mild", "cold"], ["casual"]],
    ["s6", "Black trousers", "bottom", "black", ["mild", "cold"], ["work", "dressy"]],
    ["s7", "Beige shorts", "bottom", "beige", ["hot"], ["casual", "active"]],
    ["s8", "Green midi dress", "dress", "green", ["hot", "mild"], ["dressy", "casual"]],
    ["s9", "Camel wool coat", "outer", "brown", ["cold"], ["work", "dressy", "casual"]],
    ["s10", "Denim jacket", "outer", "denim", ["mild"], ["casual"]],
    ["s11", "White sneakers", "shoes", "white", ["hot", "mild", "cold"], ["casual", "active"]],
    ["s12", "Black loafers", "shoes", "black", ["mild", "cold"], ["work", "dressy"]],
    ["s13", "Tan tote", "accessory", "beige", ["hot", "mild", "cold"], ["work", "casual"]]
  ].map(([id, name, cat, color, weather, occasions]) => ({ id, name, cat, color, weather, occasions, sample: true }));

  // ---------- State ----------
  const state = {
    items: [],
    outfits: [],
    filters: { weather: "any", occasion: "any" },
    current: {},          // slot -> item id
    locked: new Set(),    // slots kept on shuffle
    tab: "dress",
    editingId: null,
    form: blankForm()
  };

  function blankForm() {
    return { cat: "top", name: "", color: "black", weather: ["hot", "mild", "cold"], occasions: ["casual"], photo: null };
  }
  const usingSamples = () => state.items.length === 0;
  const closet = () => (usingSamples() ? SAMPLE : state.items);
  const findItem = id => closet().find(i => i.id === id);
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const $ = id => document.getElementById(id);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  // ---------- Storage ----------
  // Inside Claude the closet lives in the artifact's database (follows you across devices).
  // Opened as a plain file, it lives in this browser's local storage.
  const LS_KEY = "closet-shuffle-v1";
  const store = {
    cloud: null,
    loadLocal() {
      try {
        const d = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
        state.items = Array.isArray(d.items) ? d.items : [];
        state.outfits = Array.isArray(d.outfits) ? d.outfits : [];
      } catch (e) { /* storage blocked: start empty */ }
    },
    saveLocal() {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({ items: state.items, outfits: state.outfits }));
      } catch (e) {
        toast("Couldn't save. This browser's storage is full or turned off.");
      }
    },
    async write(coll, list, obj) {
      const i = list.findIndex(x => x.id === obj.id);
      if (i >= 0) list[i] = obj; else list.push(obj);
      if (!this.cloud) return this.saveLocal();
      try { await this.cloud.collection(coll).doc(obj.id).set(obj); }
      catch (e) { toast(e && e.code === "quota_exceeded" ? "Your closet is full. Remove a few pieces first." : "Couldn't save that change. Check your connection and try again."); }
    },
    async remove(coll, list, id) {
      const i = list.findIndex(x => x.id === id);
      if (i >= 0) list.splice(i, 1);
      if (!this.cloud) return this.saveLocal();
      try { await this.cloud.collection(coll).doc(id).delete(); }
      catch (e) { toast("Couldn't remove that. Check your connection and try again."); }
    },
    putItem(it) { return this.write("closet", state.items, it); },
    delItem(id) { return this.remove("closet", state.items, id); },
    putOutfit(o) { return this.write("outfits", state.outfits, o); },
    delOutfit(id) { return this.remove("outfits", state.outfits, id); }
  };

  function connectCloud() {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return;
    c.use("db").then(db => {
      if (!db) return;
      store.cloud = db;
      const clean = d => Object.assign({}, d.data(), { id: d.id });
      db.collection("closet").onSnapshot(snap => {
        state.items = snap.docs.map(clean).sort((a, b) => (a.created || 0) - (b.created || 0));
        const stale = Object.values(state.current).some(id => !findItem(id));
        if (stale || !Object.keys(state.current).length) shuffle();
        renderAll();
      }, () => {});
      db.collection("outfits").onSnapshot(snap => {
        state.outfits = snap.docs.map(clean).sort((a, b) => (b.created || 0) - (a.created || 0));
        renderSaved(); renderCounts();
      }, () => {});
    }).catch(() => {});
  }

  // ---------- Outfit logic ----------
  const matches = it =>
    (state.filters.weather === "any" || (it.weather || []).includes(state.filters.weather)) &&
    (state.filters.occasion === "any" || (it.occasions || []).includes(state.filters.occasion));
  const poolFor = cat => closet().filter(i => i.cat === cat && matches(i));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // A combo works when it has at most one statement color or pattern among the clothes.
  function clashes(pieces) {
    const main = pieces.filter(p => p && p.cat !== "shoes" && p.cat !== "accessory");
    const bold = new Set(main.filter(p => !NEUTRAL.has(p.color)).map(p => p.color));
    return bold.size > 1 || main.filter(p => p.color === "pattern").length > 1;
  }

  function chance(slot) {
    const w = state.filters.weather;
    if (slot === "outer") return w === "cold" ? 1 : w === "mild" ? 0.55 : w === "hot" ? 0 : 0.35;
    return 0.5; // accessory
  }

  function shuffle() {
    const keep = {};
    for (const slot of state.locked) {
      const it = findItem(state.current[slot]);
      if (it) keep[slot] = it; else state.locked.delete(slot);
    }
    let first = null, found = null;
    for (let n = 0; n < 300 && !found; n++) {
      const o = Object.assign({}, keep);
      let useDress;
      if (o.dress) useDress = true;
      else if (o.top || o.bottom) useDress = false;
      else {
        const d = poolFor("dress").length;
        const s = Math.min(poolFor("top").length, poolFor("bottom").length);
        useDress = d > 0 && (s === 0 || Math.random() < d / (d + s * 2));
      }
      if (useDress) { o.dress = o.dress || pick(poolFor("dress")); }
      else { o.top = o.top || pick(poolFor("top")); o.bottom = o.bottom || pick(poolFor("bottom")); }
      o.shoes = o.shoes || pick(poolFor("shoes"));
      for (const slot of ["outer", "accessory"]) {
        if (!o[slot] && Math.random() < chance(slot)) o[slot] = pick(poolFor(slot));
      }
      if (!first) first = o;
      if (!clashes(Object.values(o))) found = o;
    }
    const result = found || first || {};
    state.current = {};
    for (const [slot, it] of Object.entries(result)) if (it) state.current[slot] = it.id;
  }

  function swap(slot) {
    const others = Object.entries(state.current).filter(([s]) => s !== slot).map(([, id]) => findItem(id));
    const all = poolFor(slot).filter(i => i.id !== state.current[slot]);
    if (!all.length) { toast("No other " + CAT[slot].plural.toLowerCase() + " match these filters."); return; }
    const good = all.filter(i => !clashes(others.concat(i)));
    state.current[slot] = pick(good.length ? good : all).id;
    renderOutfit();
  }

  // ---------- Rendering ----------
  function thumb(it) {
    if (it.photo && /^data:image\//.test(it.photo)) return '<div class="thumb"><img src="' + esc(it.photo) + '" alt=""></div>';
    const fill = COLORS[it.color] || "#999";
    const handle = it.cat === "accessory"
      ? '<path d="M17 18 Q17 8 24 8 Q31 8 31 18" fill="none" stroke="var(--ink)" stroke-opacity=".55" stroke-width="2"/>' : "";
    return '<div class="thumb"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="' + ICONS[it.cat] + '" fill="' + fill +
      '" stroke="var(--ink)" stroke-opacity=".35" stroke-width="1.2" stroke-linejoin="round"/>' + handle + "</svg></div>";
  }
  function metaLine(it) {
    return [it.color].concat(it.weather || [], it.occasions || []).join(" · ");
  }

  function renderOutfit() {
    const box = $("outfit"), note = $("outfit-note");
    const slots = SLOT_ORDER.filter(s => state.current[s]);
    box.innerHTML = slots.map(slot => {
      const it = findItem(state.current[slot]);
      const locked = state.locked.has(slot);
      return '<article class="tag' + (locked ? " locked" : "") + '">' +
        '<div class="slot mono"><span>' + esc(CAT[slot].label) + "</span></div>" +
        thumb(it) +
        "<h3>" + esc(it.name) + "</h3>" +
        '<div class="meta mono">' + esc(metaLine(it)) + "</div>" +
        '<div class="row">' +
          '<button class="btn small lock" data-action="lock" data-slot="' + slot + '" aria-pressed="' + locked + '">' + (locked ? "Kept" : "Keep") + "</button>" +
          '<button class="btn small" data-action="swap" data-slot="' + slot + '">Swap</button>' +
        "</div></article>";
    }).join("");

    const hasBase = state.current.dress || (state.current.top && state.current.bottom);
    if (!closet().some(matches)) {
      box.innerHTML = '<div class="empty-state"><h3>Nothing matches yet</h3><p>None of your pieces are tagged for this weather and occasion. Try "Any", or edit a few pieces in My closet.</p></div>';
      note.textContent = "";
    } else if (!hasBase) {
      const missing = [];
      if (!state.current.top && !state.current.dress) missing.push("tops");
      if (!state.current.bottom && !state.current.dress) missing.push("bottoms");
      note.innerHTML = "<strong>Missing " + esc(missing.join(" and ")) + "</strong> for these filters. Add some in My closet or loosen the filters.";
    } else {
      note.textContent = state.locked.size ? "Kept pieces stay put when you shuffle." : "Tap Keep on a piece you love, then shuffle the rest.";
    }
    $("save-btn").disabled = usingSamples() || !hasBase;
    $("save-btn").title = usingSamples() ? "Add your own clothes to save outfits" : "";
  }

  function renderFilters() {
    document.querySelectorAll("[data-filter]").forEach(b => {
      b.setAttribute("aria-pressed", String(state.filters[b.dataset.filter] === b.dataset.value));
    });
  }

  function renderCloset() {
    const list = $("closet-list");
    if (usingSamples()) {
      list.innerHTML = '<div class="empty-state"><h3>Your closet is empty</h3><p>Start with the pieces you wear most: a few tops, a couple of bottoms and one pair of shoes is enough for the shuffle to work. A photo is optional. The color and tags are what matter.</p></div>';
      return;
    }
    list.innerHTML = CATS.map(c => {
      const its = state.items.filter(i => i.cat === c.id);
      if (!its.length) return "";
      return '<section class="cat-group"><h2>' + esc(c.plural) + ' <span class="mono">' + its.length + "</span></h2>" +
        '<div class="items">' + its.map(it =>
          '<article class="item">' + thumb(it) + "<h3>" + esc(it.name) + "</h3>" +
          '<div class="meta mono">' + esc(metaLine(it)) + "</div>" +
          '<div class="row"><button class="btn small" data-action="edit" data-id="' + esc(it.id) + '">Edit</button>' +
          '<button class="btn small danger" data-action="delete" data-id="' + esc(it.id) + '">Remove</button></div>' +
          "</article>").join("") + "</div></section>";
    }).join("");
  }

  function renderSaved() {
    const list = $("saved-list");
    if (!state.outfits.length) {
      list.innerHTML = '<div class="empty-state"><h3>No saved outfits yet</h3><p>When a shuffle lands on something you like, tap "Save this outfit" and it shows up here.</p></div>';
      return;
    }
    list.innerHTML = state.outfits.map(o => {
      const its = (o.itemIds || []).map(findItem).filter(Boolean);
      const when = new Date(o.created || Date.now()).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      return '<article class="saved"><div class="minis">' + its.map(thumb).join("") + "</div>" +
        '<div style="display:grid;gap:6px;justify-items:end"><span class="when">Saved ' + esc(when) +
        (its.length < (o.itemIds || []).length ? " · some pieces were removed" : "") + "</span>" +
        '<div class="row" style="display:flex;gap:6px"><button class="btn small" data-action="wear" data-id="' + esc(o.id) + '">Wear this</button>' +
        '<button class="btn small danger" data-action="unsave" data-id="' + esc(o.id) + '">Remove</button></div></div></article>';
    }).join("");
  }

  function renderCounts() {
    $("count-items").textContent = state.items.length ? String(state.items.length) : "";
    $("count-saved").textContent = state.outfits.length ? String(state.outfits.length) : "";
  }

  function renderTabs() {
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
    ["dress", "closet", "saved"].forEach(t => { $("panel-" + t).hidden = t !== state.tab; });
    $("sample-banner").hidden = !(usingSamples() && state.tab === "dress");
  }

  function renderAll() {
    renderTabs(); renderFilters(); renderOutfit(); renderCloset(); renderSaved(); renderCounts();
  }

  // ---------- Form ----------
  function buildForm() {
    $("f-type").innerHTML = CATS.map(c => '<option value="' + c.id + '">' + esc(c.label) + "</option>").join("");
    $("f-colors").innerHTML = Object.keys(COLORS).map(k =>
      '<button type="button" class="swatch" data-color="' + k + '" aria-label="' + k + '" title="' + k + '" style="background:' +
      (k === "pattern" ? "repeating-linear-gradient(45deg,#c7323a 0 4px,#e8d9b8 4px 8px)" : COLORS[k]) + '"></button>').join("");
    const checks = (list, name) => list.map(([v, l]) =>
      '<label><input type="checkbox" name="' + name + '" value="' + v + '" id="f-' + name + "-" + v + '"> ' + l + "</label>").join("");
    $("f-weather").innerHTML = checks(WEATHER, "weather");
    $("f-occasion").innerHTML = checks(OCCASIONS, "occasion");
  }

  function fillForm() {
    const f = state.form;
    $("f-type").value = f.cat;
    $("f-name").value = f.name;
    document.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-pressed", String(s.dataset.color === f.color)));
    $("color-name").textContent = f.color.charAt(0).toUpperCase() + f.color.slice(1);
    document.querySelectorAll('input[name="weather"]').forEach(c => { c.checked = f.weather.includes(c.value); });
    document.querySelectorAll('input[name="occasion"]').forEach(c => { c.checked = f.occasions.includes(c.value); });
    $("photo-preview").outerHTML = thumb({ cat: f.cat, color: f.color, photo: f.photo }).replace('class="thumb"', 'class="thumb" id="photo-preview"');
    $("photo-clear").hidden = !f.photo;
    const editing = !!state.editingId;
    $("form-title").textContent = editing ? "Edit piece" : "Add a piece";
    $("form-submit").textContent = editing ? "Save changes" : "Add to closet";
    $("form-cancel").hidden = !editing;
  }

  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onerror = reject;
      r.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const s = Math.min(1, 360 / Math.max(img.width, img.height));
          const cv = document.createElement("canvas");
          cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL("image/jpeg", 0.75));
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  function resetForm() {
    state.editingId = null;
    state.form = blankForm();
    $("f-photo").value = "";
    fillForm();
  }

  // ---------- Events ----------
  document.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;

    if (t.dataset.tab) { state.tab = t.dataset.tab; renderTabs(); window.scrollTo({ top: 0 }); return; }
    if (t.dataset.filter) {
      state.filters[t.dataset.filter] = t.dataset.value;
      shuffle(); renderFilters(); renderOutfit(); return;
    }
    if (t.dataset.color) { state.form.color = t.dataset.color; fillForm(); return; }

    const a = t.dataset.action;
    if (a === "shuffle") { shuffle(); renderOutfit(); }
    else if (a === "lock") {
      const s = t.dataset.slot;
      if (state.locked.has(s)) state.locked.delete(s); else state.locked.add(s);
      renderOutfit();
    }
    else if (a === "swap") swap(t.dataset.slot);
    else if (a === "save-outfit") {
      const ids = SLOT_ORDER.map(s => state.current[s]).filter(Boolean);
      const key = ids.slice().sort().join(",");
      if (state.outfits.some(o => (o.itemIds || []).slice().sort().join(",") === key)) { toast("Already saved"); return; }
      store.putOutfit({ id: newId(), itemIds: ids, created: Date.now() });
      renderSaved(); renderCounts(); toast("Outfit saved");
    }
    else if (a === "go-add") { state.tab = "closet"; renderTabs(); $("f-type").focus(); }
    else if (a === "edit") {
      const it = state.items.find(i => i.id === t.dataset.id);
      if (!it) return;
      state.editingId = it.id;
      state.form = { cat: it.cat, name: it.name, color: it.color, weather: (it.weather || []).slice(), occasions: (it.occasions || []).slice(), photo: it.photo || null };
      fillForm();
      $("item-form").scrollIntoView({ behavior: "smooth", block: "start" });
    }
    else if (a === "delete") {
      if (t.dataset.confirm !== "1") {
        t.dataset.confirm = "1"; t.textContent = "Sure?";
        setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ""; t.textContent = "Remove"; } }, 3000);
        return;
      }
      const id = t.dataset.id;
      store.delItem(id).then(() => {
        for (const [s, v] of Object.entries(state.current)) if (v === id) { delete state.current[s]; state.locked.delete(s); }
        if (state.editingId === id) resetForm();
        if (!Object.keys(state.current).length || usingSamples()) shuffle();
        renderAll(); toast("Removed");
      });
    }
    else if (a === "wear") {
      const o = state.outfits.find(x => x.id === t.dataset.id);
      if (!o) return;
      state.current = {};
      (o.itemIds || []).map(findItem).filter(Boolean).forEach(it => { state.current[it.cat] = it.id; });
      state.locked = new Set(Object.keys(state.current));
      state.tab = "dress"; renderAll(); window.scrollTo({ top: 0 });
    }
    else if (a === "unsave") { store.delOutfit(t.dataset.id).then(() => { renderSaved(); renderCounts(); }); }
  });

  $("f-type").addEventListener("change", e => { state.form.cat = e.target.value; fillForm(); });
  $("f-name").addEventListener("input", e => { state.form.name = e.target.value; });
  $("f-weather").addEventListener("change", () => {
    state.form.weather = Array.from(document.querySelectorAll('input[name="weather"]:checked')).map(c => c.value);
  });
  $("f-occasion").addEventListener("change", () => {
    state.form.occasions = Array.from(document.querySelectorAll('input[name="occasion"]:checked')).map(c => c.value);
  });
  $("f-photo").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try { state.form.photo = await shrinkPhoto(file); fillForm(); }
    catch (err) { toast("That file couldn't be read as a photo. Try a JPG or PNG."); }
  });
  $("photo-clear").addEventListener("click", () => { state.form.photo = null; $("f-photo").value = ""; fillForm(); });
  $("form-cancel").addEventListener("click", resetForm);

  $("item-form").addEventListener("submit", async e => {
    e.preventDefault();
    const f = state.form;
    if (!f.weather.length) { toast("Pick at least one kind of weather."); return; }
    if (!f.occasions.length) { toast("Pick at least one occasion."); return; }
    const wasSamples = usingSamples();
    const existing = state.editingId && state.items.find(i => i.id === state.editingId);
    const name = f.name.trim() || (f.color.charAt(0).toUpperCase() + f.color.slice(1) + " " + CAT[f.cat].label.toLowerCase());
    const item = {
      id: existing ? existing.id : newId(),
      name, cat: f.cat, color: f.color,
      weather: f.weather.slice(), occasions: f.occasions.slice(),
      photo: f.photo || null,
      created: existing ? existing.created : Date.now()
    };
    await store.putItem(item);
    toast(existing ? "Changes saved" : "Added " + name);
    if (wasSamples) { state.current = {}; state.locked.clear(); shuffle(); }
    const keepCat = f.cat;
    resetForm();
    if (!existing) { state.form.cat = keepCat; fillForm(); }
    renderAll();
  });

  // ---------- Start ----------
  buildForm();
  store.loadLocal();
  fillForm();
  shuffle();
  renderAll();
  connectCloud();
})();
</script>
<!-- APP END -->
</body>
</html>
